name: floormc2

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download and Start Minecraft Server
        run: |
          mkdir server
          cd server
          wget -O paper.jar https://api.papermc.io/v2/projects/paper/versions/1.20.4/builds/496/downloads/paper-1.20.4-496.jar
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          curl -sS https://playit.gg/downloads/playit-linux-amd64 -o playit
          chmod +x playit
          ./playit start &
          java -Xms4G -Xmx6G -jar paper.jar nogui
          
